<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Zero Hero Header</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">

    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>

    <div class="glass-card">

        <span class="badge">
            ❄ Absolute Zero Experience
        </span>

        <h1 class="hero-title">
            ABSOLUTE
            <span>ZERO</span>
        </h1>

        <p>
            Hyper-smooth futuristic hero header built using pure HTML &
            CSS featuring glassmorphism, floating particles,
            fluid typography and animated icy lighting.
        </p>

        <div class="buttons">
            <a href="#" class="primary">Get Started</a>
            <a href="#" class="secondary">Learn More</a>
        </div>

    </div>

</section>

</body>
</html>
